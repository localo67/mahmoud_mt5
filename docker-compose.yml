# Docker Compose — bot IA + Telegram en lecture seule.
# Aucun acces MT5 n'est possible depuis ce conteneur Linux.
version: "3.8"

services:
  bot:
    build: .
    container_name: mt5-ai-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TRADING_MODE: "off"
    volumes:
      - ./state.json:/app/state.json
      - ./logs:/app/logs
    # Pas de port expose — le bot fait du polling Telegram
